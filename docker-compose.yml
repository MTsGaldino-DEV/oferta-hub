services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oferta
      POSTGRES_PASSWORD: oferta
      POSTGRES_DB: ofertahub
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oferta"]
      interval: 5s
      retries: 10

volumes:
  pgdata:

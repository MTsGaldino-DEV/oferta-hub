server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Espelha o proxy do vite.config.ts: /api e /r vao pra API.
    location /api/ {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sem buffer: o polling do QR do WhatsApp responde na hora.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Link curto publico (/r/:code) -> redirect da API.
    location /r/ {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:3333/health;
        proxy_set_header Host $host;
    }

    # SPA: qualquer rota do React Router cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
